apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: telemetry-mcp-authz
  namespace: wp-dev
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: telemetry-mcp-route
  rules:
    authentication:
      anonymous:
        anonymous: {}
        when:
          - predicate: '!request.headers.exists(h, h == "x-mcp-toolname")'
      # Participant realm entries added by deploy/scripts/add-participant.sh.
      # Pattern:
      #   waterplant-<name>:
      #     jwt:
      #       issuerUrl: https://keycloak-wp-dev.apps.../realms/waterplant-<name>
      #     when:
      #       - predicate: 'request.headers.exists(h, h == "x-mcp-toolname")'
    authorization:
      tool-access-check:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname')"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in (has(auth.identity.resource_access) && auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername']) ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
    response:
      unauthorized:
        body:
          value: |
            {
              "jsonrpc": "2.0",
              "error": {
                "code": -32600,
                "message": "Forbidden: Insufficient permissions for this tool."
              }
            }
