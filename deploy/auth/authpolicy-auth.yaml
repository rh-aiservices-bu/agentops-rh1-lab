# JWT authentication policy on the public 'mcp' listener.
#
# On a shared cluster this resource already exists and is managed by the
# add-participant.sh script (which patches in per-participant realm issuers).
# This file documents the intended structure for a fresh standalone cluster.
#
# Per-participant authentication entries look like:
#   waterplant-<name>:
#     jwt:
#       issuerUrl: https://keycloak-wp-dev.apps.caiprod.rhoai.rh-aiservices-bu.com/realms/waterplant-<name>
#
# The 'when' predicate gates this policy to the waterplant lab hostname; adjust
# to match your actual MCP Gateway public hostname.
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-auth-policy
  namespace: mcp-gateway
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: mcp-gateway
    sectionName: mcp
  defaults:
    when:
      - predicate: "!request.path.contains('/.well-known')"
    rules:
      authentication:
        # Add one entry per participant realm via add-participant.sh.
        # Example entry — replace <name> with the actual participant name:
        # waterplant-<name>:
        #   jwt:
        #     issuerUrl: https://keycloak-wp-dev.apps.caiprod.rhoai.rh-aiservices-bu.com/realms/waterplant-<name>
      response:
        unauthenticated:
          code: 401
          headers:
            "WWW-Authenticate":
              value: >-
                Bearer resource_metadata=https://mcp.apps.caiprod.rhoai.rh-aiservices-bu.com/.well-known/oauth-protected-resource/mcp
          body:
            value: |
              {
                "error": "Unauthorized",
                "message": "Authentication required."
              }
