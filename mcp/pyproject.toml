[project]
name = "waterplant-mcp"
version = "0.1.0"
description = "MCP servers exposing the simulated water plant to the maintenance agent"
requires-python = ">=3.12"
dependencies = ["mcp>=2.1,<3", "httpx>=0.27", "pydantic>=2.9", "uvicorn[standard]>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterplant_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
