# Sandbox pods are locked down by default — confirmed on the existing
# cai-crew deployment, whose `openshell-sandbox-ssh` NetworkPolicy allows
# ingress ONLY on port 2222 (the gateway's own exec tunnel). Anything else,
# including our chat adapter's port, needs an explicit rule.
#
# IMPORTANT: `openshell.ai/managed-by`/`openshell.ai/sandbox-name` labels live
# on the Sandbox *custom resource*, not the underlying Pod — confirmed live,
# not assumed (the Pod only carries agents.x-k8s.io/sandbox-name-hash, a
# non-deterministic hash, plus topology labels). provision-hermes-sandbox.sh
# stamps `app.kubernetes.io/name=hermes-sandbox` onto each sandbox Pod after
# creation specifically so this selector (and the matching Service selector)
# has something real to match. One static NetworkPolicy still covers every
# participant's Hermes sandbox, since this gateway is dedicated to Hermes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-openshell-sandbox-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-sandbox
  policyTypes:
    - Ingress
  ingress:
    # Gateway's own exec/SSH tunnel.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openshell
      ports:
        - port: 2222
          protocol: TCP
    # Chat adapter — reachable from wherever the UI's AGENT_URL traffic comes from.
    - from:
        - {{ toYaml .Values.networkPolicy.adapterSource | nindent 12 }}
      ports:
        - port: {{ .Values.adapter.port }}
          protocol: TCP
