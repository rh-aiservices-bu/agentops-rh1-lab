# RBAC for the gateway-install hook Job. Narrower than the upstream manifest
# (cluster-admin) — only genuinely cluster-scoped bits get a ClusterRole below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-openshell-installer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-openshell-installer-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-installer
    namespace: {{ .Values.namespace }}
---
# Cluster-scoped: `oc adm policy add-scc-to-user privileged -z openshell-sandbox`
# requires `use` on the privileged SCC, which is not namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-openshell-installer-scc-use
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
  # The vendor chart provisions its own cluster-scoped RBAC (openshell-node-reader).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Needed so this SA can grant RBAC the vendor chart's own roles need.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-openshell-installer-scc-use
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-openshell-installer-scc-use
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-installer
    namespace: {{ .Values.namespace }}
