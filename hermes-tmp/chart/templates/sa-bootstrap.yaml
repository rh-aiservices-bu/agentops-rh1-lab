# RBAC for the gateway-install hook Job.
#
# Deliberately narrower than the source manifest (openshell/manifests/sa-installer.yaml
# in the cai-krew hermes-container repo), which grants blanket cluster-admin. Only the
# SCC-use grant and the apps-domain lookup are genuinely cluster-scoped; everything
# else the install Job does (StatefulSet/Route/Secret/ConfigMap creation) is
# namespace-scoped, so it gets namespace `admin` instead.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-openshell-installer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-openshell-installer-admin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-installer
    namespace: {{ .Values.namespace }}
---
# Cluster-scoped: `oc adm policy add-scc-to-user privileged -z openshell-sandbox`
# requires `use` on the privileged SCC, which is not namespaced.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-openshell-installer-scc-use
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get"]
  # The vendor OpenShell Helm chart (installed by job-install-gateway.yaml via
  # `helm upgrade --install`) provisions its own cluster-scoped RBAC
  # (ClusterRole/ClusterRoleBinding "openshell-node-reader"). RBAC's `create`
  # verb cannot be scoped by resourceNames, so this is the one place this
  # chart can't narrow below "any ClusterRole/ClusterRoleBinding" — still far
  # short of cluster-admin, and the Job also cleans up a stale
  # openshell-node-reader left behind by a previous install in another
  # namespace (see job-install-gateway.yaml).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # RBAC escalation prevention: Kubernetes refuses to let a principal grant
  # permissions it doesn't itself hold. The vendor OpenShell chart's own
  # ClusterRole/Role (openshell-node-reader, openshell-sandbox) need these —
  # confirmed live, not guessed, from the exact "attempting to grant RBAC
  # permissions not currently held" error on first install attempt.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-openshell-installer-scc-use
  labels:
    {{- include "hermes-openshell.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-openshell-installer-scc-use
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-installer
    namespace: {{ .Values.namespace }}
