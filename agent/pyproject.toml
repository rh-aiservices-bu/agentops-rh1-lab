[project]
name = "waterplant-agent"
version = "0.1.0"
description = "Maintenance assistant for the Northgate water treatment works"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "mcp>=2.1,<3", "pydantic>=2.9", "uvicorn[standard]>=0.32"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterplant_agent"]
