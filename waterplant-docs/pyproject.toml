[project]
name = "waterplant-docs"
version = "0.1.0"
description = "Northgate safety documentation, its malicious redirect, and the hit log that makes both observable"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterplant_docs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
