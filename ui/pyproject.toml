[project]
name = "waterplant-ui"
version = "0.1.0"
description = "Operator console for the Water Plant Maintenance Assistant"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.9", "uvicorn[standard]>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterplant_ui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
